name: iOS CI (SwiftLint + Tests for Xcode 16.2)

on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - '.github/workflows/ios-ci.yml'
      - '.swiftlint.yml'
      - '**/*.swift'
      - '**/*.xcodeproj'
      - '**/*.xcworkspace'

jobs:
  lint-and-test:
    runs-on: macos-latest

    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint on Changed Files
        run: |
          FILES=$(git diff --diff-filter=ACMR --name-only origin/${{ github.base_ref }} | grep '\.swift$' || true)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs swiftlint --strict --path
          else
            echo "No Swift files changed."
          fi

      - name: Run Tests (Xcodebuild)
        run: |
          xcodebuild test \
            -scheme MarvelXplorer \
            -project MarvelXplorer.xcodeproj \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
